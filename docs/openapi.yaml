openapi: 3.0.3
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: |
    A simple ledger API for creating accounts and recording immutable credit and
    debit transactions. Account balances are updated atomically with each
    transaction.

    Amounts are positive integers in the ledger's base unit (no decimals).
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
  - name: Accounts
  - name: Transactions
  - name: Transfers

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /accounts:
    post:
      tags: [Accounts]
      summary: Create an account
      description: |
        Creates an account with an initial balance of 0. The `created_at`
        timestamp is generated by the server. Any client-supplied `balance`
        field is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Alice
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get an account
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /accounts/{accountId}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get an account balance
      responses:
        '200':
          description: Current account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /accounts/{accountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Transactions]
      summary: Add a credit or debit transaction
      description: |
        Creates an immutable transaction and updates the account balance in the
        same database transaction.

        - A credit increases the balance.
        - A debit decreases the balance and is rejected with `422` when funds are
          insufficient.
        - `reference_id` is unique per account. Repeating it returns `409` and
          leaves the balance unchanged. The same `reference_id` may be used on a
          different account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransaction'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: Duplicate reference_id for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_REFERENCE
                  message: A transaction with this reference_id already exists for the account.
                  details:
                    account_id: 7f9d3a68-7f4c-4f2e-8a3c-3f4a2b1c9d10
                    reference_id: invoice-1001
                    existing_transaction_id: 34a4de0c-25e9-4d1f-9e48-93fbbfa9a2b7
        '422':
          description: Insufficient balance for a debit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INSUFFICIENT_BALANCE
                  message: The account has insufficient balance.
                  details:
                    account_id: 7f9d3a68-7f4c-4f2e-8a3c-3f4a2b1c9d10
                    balance: 100
                    requested_amount: 150

    get:
      tags: [Transactions]
      summary: List transaction history
      description: |
        Returns transactions for the account in latest-first order
        (`created_at` descending). Supports filtering by type and pagination.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by transaction type. Omit to return both.
          schema:
            type: string
            enum: [credit, debit]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistory'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /transfers:
    post:
      tags: [Transfers]
      summary: Transfer money between accounts (bonus)
      description: |
        Atomically debits the source account and credits the destination account.
        If any validation fails, neither account is changed. The same
        `reference_id` is recorded on both transactions and can only be used once
        per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResult'
        '400':
          description: Validation error or identical source and destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/DuplicateReference'
        '422':
          $ref: '#/components/responses/InsufficientBalance'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Account:
      type: object
      required: [id, name, balance, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 7f9d3a68-7f4c-4f2e-8a3c-3f4a2b1c9d10
        name:
          type: string
          example: Alice
        balance:
          type: integer
          example: 100
        created_at:
          type: string
          format: date-time
          example: '2026-10-26T12:00:00.000Z'

    Balance:
      type: object
      required: [account_id, balance]
      properties:
        account_id:
          type: string
          format: uuid
        balance:
          type: integer
          example: 100

    Transaction:
      type: object
      required: [id, account_id, type, amount, description, reference_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: integer
          minimum: 1
          example: 50
        description:
          type: string
          example: Invoice payment
        reference_id:
          type: string
          example: invoice-1001
        created_at:
          type: string
          format: date-time

    CreateTransaction:
      type: object
      required: [type, amount, reference_id]
      properties:
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: integer
          minimum: 1
          example: 50
        description:
          type: string
          maxLength: 500
          default: ''
          example: Invoice payment
        reference_id:
          type: string
          minLength: 1
          maxLength: 100
          example: invoice-1001

    Pagination:
      type: object
      required: [page, page_size, total_records, total_pages]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_records:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3

    TransactionHistory:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: '#/components/schemas/Pagination'

    TransferRequest:
      type: object
      required: [from_account_id, to_account_id, amount, reference_id]
      properties:
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
          example: 30
        description:
          type: string
          maxLength: 500
          example: Rent share
        reference_id:
          type: string
          minLength: 1
          maxLength: 100
          example: transfer-2026-10-26-001

    TransferResult:
      type: object
      required: [reference_id, from, to, debit, credit]
      properties:
        reference_id:
          type: string
        from:
          $ref: '#/components/schemas/Balance'
        to:
          $ref: '#/components/schemas/Balance'
        debit:
          $ref: '#/components/schemas/Transaction'
        credit:
          $ref: '#/components/schemas/Transaction'

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Request validation failed.
            details:
              type: object
              additionalProperties: true

  responses:
    AccountNotFound:
      description: Account does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ACCOUNT_NOT_FOUND
              message: Account not found.
              details:
                account_id: 00000000-0000-0000-0000-000000000000

    ValidationError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed.
              details:
                issues:
                  - path: amount
                    message: amount must be greater than 0

    DuplicateReference:
      description: Duplicate reference_id for an account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DUPLICATE_REFERENCE
              message: A transaction with this reference_id already exists for the account.

    InsufficientBalance:
      description: Source account has insufficient balance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_BALANCE
              message: The account has insufficient balance.
              details:
                balance: 10
                requested_amount: 30
